services:
  bot:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/pvg-bot:latest
    env_file: .env
    environment:
      AI_URL: http://llama:8080
    restart: unless-stopped
  llama:
    # See pod.yaml for why this version is pinned
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b5121
    command:
      - --hf-repo
      - NbAiLab/nb-llama-3.1-8B-Instruct-Q4_K_M-GGUF
      - --hf-file
      - nb-llama-3.1-8b-instruct-q4_k_m.gguf
      - --n-gpu-layers
      - "99"
      - --ctx-size
      - "4096"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    environment:
      LLAMA_CACHE: /models
    devices:
      - nvidia.com/gpu=all
    volumes:
      - models:/models
    restart: unless-stopped
volumes:
  models:
