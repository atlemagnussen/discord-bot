apiVersion: v1
kind: Pod
metadata:
  name: pvg-bot
spec:
  restartPolicy: Always
  containers:
    - name: bot
      image: localhost/pvg-bot:latest
      envFrom:
        - secretRef:
            name: pvg-bot
      env:
        # Containers in a pod share localhost
        - name: AI_URL
          value: http://localhost:8080
    - name: llama
      # Pinned on purpose: this build uses CUDA 12.4 and includes Pascal code, so it runs on the GTX 1060
      # with Debian's driver 550. Newer images need driver 570+ for that card.
      image: ghcr.io/ggml-org/llama.cpp:server-cuda-b5121
      args:
        - --hf-repo
        - NbAiLab/nb-llama-3.1-8B-Instruct-Q4_K_M-GGUF
        - --hf-file
        - nb-llama-3.1-8b-instruct-q4_k_m.gguf
        # Put all layers on the GPU
        - --n-gpu-layers
        - "99"
        - --ctx-size
        - "4096"
        - --host
        - 0.0.0.0
        - --port
        - "8080"
      env:
        # Where --hf-repo downloads the model to
        - name: LLAMA_CACHE
          value: /models
      resources:
        limits:
          nvidia.com/gpu=all: 1
      volumeMounts:
        - name: models
          mountPath: /models
  volumes:
    # Podman named volume, so the ~5 GB model survives pod restarts and redeploys
    - name: models
      persistentVolumeClaim:
        claimName: pvg-bot-models
