# Copy to secret.yaml, fill in, then: podman kube play secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: pvg-bot
type: Opaque
stringData:
  # Developer Portal -> Bot -> Reset Token
  DISCORD_TOKEN: ""
  # Developer Portal -> General Information -> Application ID
  DISCORD_CLIENT_ID: ""
  # Optional, for testing: a server ID; commands then register instantly to that server only.
  # Leave empty to serve every server the bot is in.
  DISCORD_GUILD_ID: ""
  # Optional: channels for the daily poppel wisdom at 07:57, comma-separated, e.g. one per server
  # (right-click channel -> Copy Channel ID)
  DAILY_CHANNEL_ID: ""
